[package]
name = "imxrt-usbh"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2"
cotton-usb-host = { version = "0.3", default-features = false }
futures-core = { version = "0.3", default-features = false }
imxrt-ral = "0.6"
rtic-common = "1"
critical-section = "1.1"
log = { version = "0.4", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7"

[dependencies.defmt-03]
package = "defmt"
version = "0.3"
optional = true

[features]
default = ["log"]
defmt-03 = ["dep:defmt-03"]
log = ["dep:log"]
hub-support = []

# The Teensy 4.1 example builds against the sibling checkouts of imxrt-hal
# (its `board` crate and `imxrt-log`) so the example follows local changes.
[dev-dependencies]
board = { path = "../imxrt-hal/board", features = ["teensy4"] }
imxrt-log = { path = "../imxrt-hal/logging", default-features = false, features = ["log", "lpuart", "usbd"] }
imxrt-ral = { version = "0.6", features = ["imxrt1062"] }
imxrt-rt = "0.1.7"
imxrt-usbd = "0.4"
rtic = { version = "2", features = ["thumbv7-backend"] }
log = "0.4"
futures = { version = "0.3", default-features = false }
cotton-usb-host-midi = { path = "cotton-usb-host-midi", default-features = false }

[[example]]
name = "rtic_usb_midi_keyboard"
required-features = ["imxrt-ral/imxrt1062"]

[package.metadata.docs.rs]
default-target = "thumbv7em-none-eabihf"

[workspace]
members = ["cotton-usb-host-midi"]
