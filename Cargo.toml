[package]
name = "imxrt-usbh"
version = "0.1.0"
edition = "2021"

[dependencies]
bitflags = "2"
cotton-usb-host = { version = "0.3", default-features = false }
futures-core = { version = "0.3", default-features = false }
imxrt-ral = "0.6"
rtic-common = "1"
critical-section = "1.1"
log = { version = "0.4", optional = true }

[target.'cfg(target_os = "none")'.dependencies]
cortex-m = "0.7"

[dependencies.defmt-03]
package = "defmt"
version = "0.3"
optional = true

[features]
default = ["log"]
defmt-03 = ["dep:defmt-03"]
log = ["dep:log"]
hub-support = []

# Dev-dependencies exist for the Teensy 4.1 example only.
[dev-dependencies]
# `board` is imxrt-hal's unpublished board-support crate, so it comes from git,
# pinned to the imxrt-hal 0.6.0 line. Bump the rev when moving to a newer HAL.
board = { git = "https://github.com/imxrt-rs/imxrt-hal", rev = "7f900ae759540eca44332a8dffa8e4d15c7bc4a3", features = ["teensy4"] }
# The same source and rev as `board`, so that `hal::pit::Pit` here is the type
# `board::Common` hands out. Keep the two revs equal.
imxrt-hal = { git = "https://github.com/imxrt-rs/imxrt-hal", rev = "7f900ae759540eca44332a8dffa8e4d15c7bc4a3", features = ["imxrt1060"] }
imxrt-ral = { version = "0.6", features = ["imxrt1062"] }
imxrt-rt = "0.1.7"
imxrt-usbd = "0.4"
rtic = { version = "2", features = ["thumbv7-backend"] }
log = "0.4"
futures = { version = "0.3", default-features = false }
cotton-usb-host-midi = { path = "cotton-usb-host-midi", default-features = false }

[[example]]
name = "rtic_usb_midi_keyboard"
required-features = ["imxrt-ral/imxrt1062"]

[package.metadata.docs.rs]
default-target = "thumbv7em-none-eabihf"

[workspace]
members = ["cotton-usb-host-midi"]
